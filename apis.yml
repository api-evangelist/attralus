aid: attralus
name: Attralus
description: 'Attralus is a clinical-stage biopharmaceutical company headquartered
  in San Francisco, California, developing transformative medicines for patients with
  systemic amyloidosis. Its proprietary pan-amyloid removal (PAR) platform pairs a
  pan-amyloid binding peptide with a humanized IgG1 monoclonal antibody so the resulting
  fusion protein binds amyloid deposits across every amyloidosis type and stage and
  recruits the immune system to clear them. The lead candidate, zamubafusp alfa (AT-02),
  is a pan-amyloid depleter in a Phase 1/2 open-label extension study and has received
  U.S. FDA Orphan Drug Designation for the treatment of AL amyloidosis; a next-generation
  PAR program (IV and subcutaneous) and a research-stage neurodegeneration program
  targeting Abeta, tau and alpha-synuclein aggregates follow behind it. Attralus''
  molecular imaging agents AT-01 (124-iodine evuzamitide) and AT-05 (99mTc-p5+14)
  were acquired by Bayer in January 2026. The company was launched in 2020 with a
  Series A from venBio Partners and has since raised additional rounds including a
  $56 million financing led by Alpha Wave Ventures with participation from Bristol
  Myers Squibb. Attralus is a therapeutics developer, not a software vendor: it publishes
  no developer portal, no public API, no SDKs and no machine-readable API contract
  of any kind (every OpenAPI, GraphQL, MCP, A2A and /.well-known/ path probed on its
  hosts returns 404, and no api/developer/docs subdomain resolves).'
